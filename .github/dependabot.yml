# Dependabot opens PRs that bump pinned dependencies.
#
# Why this matters for LLM tooling: once you pin (see
# cases/02-silent-nan-gate/requirements.txt), you need a safe way to upgrade.
# Each Dependabot PR runs the offline CI, including
# tests/test_harness_contract.py. If a LangChain upgrade breaks the judge
# wiring, the upgrade PR goes red with a precise message, instead of a
# silent NaN in production.
version: 2
updates:
  - package-ecosystem: pip
    directory: /cases/02-silent-nan-gate
    schedule:
      interval: weekly
    groups:
      # Upgrade the LangChain family together; they're released in lockstep
      # and mixing versions is a common source of import errors.
      langchain:
        patterns: ["langchain*", "langsmith"]
    open-pull-requests-limit: 5
